<table class="policy-table">
  <thead>
    <tr>
      <th>&nbsp;</th>
      <th>Policy Number</th>
      <th>Result</th>
    </tr>
  </thead>
  <tbody>
    @for (policy of policies; track $index; let i = $index) {
      <tr>
        <td><span class="isHiddenSmall">{{ i + 1 }}</span></td>
        <td>
          <b class="isHiddenMedium">Policy Number: </b>
          {{ policy.policyNumber }}
        </td>
        <td>
          <b class="isHiddenMedium">Result: </b>
          @if(policy.isValid) {
            <span class="hdg hdg--success-msg">Valid</span>
          } @else {
            <span class="hdg hdg--error-msg">Error</span>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
